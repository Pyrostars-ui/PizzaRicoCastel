
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: frankenphp_dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
      - "127.0.0.1:${HTTP3_PORT:-8443}:443/udp"
    volumes:
      - ./:/app
      - app_var:/app/var
      - ./docker/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SERVER_NAME: "${SERVER_NAME:-:80}"
      APP_RUNTIME: "Symfony\\Component\\Runtime\\SymfonyRuntime"
      MAX_REQUESTS: "${MAX_REQUESTS:-500}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@db:5432/${POSTGRES_DB:-pizzarico}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8"
      MAILER_DSN: "smtp://mailer:1025"
    depends_on:
      database:
        condition: service_healthy

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pizzarico}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-pizzarico}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks:
      default:
        aliases:
          - db
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  app_var:
  caddy_data:
  caddy_config:

