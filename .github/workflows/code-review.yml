name: Revue automatisée

on:
  push:
    branches:
      - v2
      - develop
      - 'hotfix/**'
  pull_request:
    branches:
      - v2
      - develop

permissions:
  contents: read

jobs:
  review:
    name: Analyse statique & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.4", "8.5" ]

    # --------------------------------------------------------------------------
    # CONTENEUR DE SERVICE : strictement identique au pipeline SecOps (ci.yml).
    # Le préparatif (PHP, Composer, .env) et le provisionnement de la base de
    # test sont délégués aux actions composites partagées — zéro config parallèle.
    # --------------------------------------------------------------------------
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_DEBUG: '0'
      APP_SECRET: 'ci_static_secret_token_for_testing_only'
      DATABASE_URL: 'postgresql://app:secret_test_password@127.0.0.1:5432/app_test?serverVersion=16&charset=utf8'
      CANONICAL_BASE_URL: https://pizzarico-castelsarrasin.example.fr
      MAILER_DSN: null://null

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Préparation du runtime QA (PHP ${{ matrix.php-version }}, Composer, .env)
        uses: ./.github/actions/qa-setup
        with:
          php-version: ${{ matrix.php-version }}

      - name: Linting PHP (syntaxe)
        run: find src tests -name "*.php" -exec php -l {} \;

      - name: Lint du conteneur Symfony
        run: php bin/console lint:container --no-interaction

      - name: Lint des templates Twig
        run: php bin/console lint:twig --no-interaction templates/

      - name: Lint des fichiers YAML
        run: php bin/console lint:yaml --no-interaction config/ tests/

      - name: PHPStan (niveau du projet)
        run: php vendor/bin/phpstan analyse --no-progress --no-interaction

      - name: Provisionnement de la base de test (création, migrations, seed)
        uses: ./.github/actions/qa-testdb

      - name: PHPUnit
        run: php vendor/bin/phpunit --no-coverage
